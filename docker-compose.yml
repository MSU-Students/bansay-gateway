version: '3.1'

volumes:
  db:
    driver: local

services:
  db:
    image: postgres:16
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: bansay_user_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data

  gateway:
    build: .
    image: bansay/gateway:local
    restart: always
    ports:
      - 3000:3000
    environment:
      - USER_SERVICE_HOST=user
      - LIABILITY_SERVICE_HOST=liability
      - ATTENDANCE_SERVICE_HOST=attendance

  user:
    build: ../bansay-user-service
    image: bansay/user-service:local
    restart: always
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DATABASE_NAME=bansay_user_db
    depends_on:
      - db

  liability:
    build: ../bansay-liability-service
    image: bansay/liability-service:local
    restart: always

  attendance:
    build: ../bansay-attendance-service
    image: bansay/attendance-service:local
    restart: always
